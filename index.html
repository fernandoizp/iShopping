<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05030a">
<title>Paradise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Pixelify+Sans:wght@400;700&display=swap">
<style>
  :root { color-scheme: dark; --bg: #05030a; --fg: #e8e0d0; --btn: #1a1420; --edge: #4a3e56; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #screen { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #help { color: #5a5266; font: 12px monospace; margin: 10px 16px 0; text-align: center; }
  #touch { display: none; }
  body.touch #help { display: none; }
  body.touch #touch { display: flex; width: 100%; max-width: 560px; justify-content: space-between; align-items: center; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); box-sizing: border-box; }
  body.touch { justify-content: flex-start; padding-top: env(safe-area-inset-top); }
  @media (orientation: landscape) {
    body.touch { justify-content: center; }
    body.touch #touch { position: fixed; inset: 0; max-width: none; padding: 0 14px; pointer-events: none; align-items: flex-end; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
    body.touch #touch > * { pointer-events: auto; opacity: 0.5; }
  }
  .pad { position: relative; width: 132px; height: 132px; }
  .pad div, .btns div, .sys div { position: absolute; background: var(--btn); border: 2px solid var(--edge); color: var(--fg); font: bold 14px monospace; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
  .pad [data-a="up"] { left: 44px; top: 0; width: 44px; height: 44px; }
  .pad [data-a="down"] { left: 44px; top: 88px; width: 44px; height: 44px; }
  .pad [data-a="left"] { left: 0; top: 44px; width: 44px; height: 44px; }
  .pad [data-a="right"] { left: 88px; top: 44px; width: 44px; height: 44px; }
  .pad .d { opacity: 0; }
  .pad [data-a="up left"] { left: 0; top: 0; width: 44px; height: 44px; }
  .pad [data-a="up right"] { left: 88px; top: 0; width: 44px; height: 44px; }
  .pad [data-a="down left"] { left: 0; top: 88px; width: 44px; height: 44px; }
  .pad [data-a="down right"] { left: 88px; top: 88px; width: 44px; height: 44px; }
  .btns { position: relative; width: 160px; height: 140px; }
  .btns div { border-radius: 50%; width: 56px; height: 56px; font-size: 17px; }
  .btns [data-a="jump"] { right: 0; top: 30px; background: #3a1418; border-color: #b23246; }
  .btns [data-a="attack"] { right: 66px; top: 58px; background: #16222a; border-color: #7fe8ff; }
  .btns [data-a="dash"] { right: 10px; top: 92px; width: 44px; height: 44px; font-size: 12px; background: #2a2014; border-color: #d8a43a; }
  .btns [data-a="heal"] { right: 78px; top: 4px; width: 44px; height: 44px; font-size: 12px; background: #142a2a; border-color: #50e0c8; }
  .sys { position: relative; width: 60px; height: 110px; }
  .sys div { width: 56px; height: 24px; font-size: 10px; border-radius: 12px; left: 2px; }
  .sys [data-a="start"] { top: 30px; }
  .sys [data-a="mute"] { top: 64px; }
</style>
</head>
<body>
  <canvas id="screen" width="480" height="270"></canvas>
  <div id="touch">
    <div class="pad">
      <div data-a="up">▲</div><div data-a="down">▼</div><div data-a="left">◀</div><div data-a="right">▶</div>
      <div class="d" data-a="up left"></div><div class="d" data-a="up right"></div><div class="d" data-a="down left"></div><div class="d" data-a="down right"></div>
    </div>
    <div class="sys"><div data-a="start">MAPA</div><div data-a="mute">SONIDO</div></div>
    <div class="btns"><div data-a="heal">H</div><div data-a="attack">B</div><div data-a="jump">A</div><div data-a="dash">R</div></div>
  </div>
  <div id="help">Flechas mover · Z saltar · X espada (↑/↓ + X: tajo vertical) · C impulso · V curar · ↑ hablar · Enter mapa · N sonido · Mando compatible</div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
