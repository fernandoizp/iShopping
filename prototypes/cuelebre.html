<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Paradise: El Cuélebre</title>
<style>
  html, body { margin: 0; height: 100%; background: #07050a; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; display: block; width: min(100vw, 177.7vh); }
  #help { color: #6f6478; font: 12px monospace; margin: 8px 16px 0; text-align: center; }
  #touch { display: none; width: 100%; max-width: 560px; justify-content: space-between; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); box-sizing: border-box; }
  body.touch #touch { display: flex; }
  body.touch #help { display: none; }
  #touch div { display: flex; gap: 10px; }
  #touch b { width: 58px; height: 58px; border-radius: 50%; background: #241b2c; border: 2px solid #5b4a6a; color: #e8dccb; font: bold 15px monospace; display: flex; align-items: center; justify-content: center; }
  @media (orientation: landscape) { body.touch #touch { position: fixed; inset: auto 0 0 0; max-width: none; opacity: .5; } }
</style>
</head>
<body>
<canvas id="c" width="480" height="270"></canvas>
<div id="help">← → mover · Z saltar · X estoque · C esquivar · R reiniciar</div>
<div id="touch"><div><b data-k="left">◀</b><b data-k="right">▶</b></div><div><b data-k="dash">C</b><b data-k="attack">X</b><b data-k="jump">Z</b></div></div>
<script>
// PARADISE · prueba de jefe: El Cuélebre. Todo el arte es procedural, rasterizado a píxel.
const W = 480, H = 270, FLOOR = 226, POOL = 238;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return [c, x]; };
let seed = 11; const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
const R = (a, b) => a + Math.random() * (b - a);
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const rgb = (h) => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };

// ---------- Utilidades de pixel art ----------
function crisp(c, th = 100) {
  const x = c.getContext('2d'), d = x.getImageData(0, 0, c.width, c.height), a = d.data;
  for (let i = 3; i < a.length; i += 4) a[i] = a[i] > th ? 255 : 0;
  x.putImageData(d, 0, 0);
}
function outline(c, col = '#0b0810') {
  const x = c.getContext('2d'), w = c.width, h = c.height, d = x.getImageData(0, 0, w, h), a = d.data, o = new Uint8ClampedArray(a);
  const [r, g, b] = rgb(col);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const k = (j * w + i) * 4;
    if (a[k + 3]) continue;
    const n = (i > 0 && a[k - 1]) || (i < w - 1 && a[k + 7]) || (j > 0 && a[k - w * 4 + 3]) || (j < h - 1 && a[k + w * 4 + 3]);
    if (n) { o[k] = r; o[k + 1] = g; o[k + 2] = b; o[k + 3] = 255; }
  }
  d.data.set(o); x.putImageData(d, 0, 0);
}
// Reduce a una paleta con tramado ordenado: la clave del aspecto "pixel art" en formas procedurales.
function quantize(c, pal, dither = 18) {
  const P = pal.map(rgb), x = c.getContext('2d'), w = c.width, d = x.getImageData(0, 0, w, c.height), a = d.data;
  for (let k = 0; k < a.length; k += 4) {
    if (!a[k + 3]) continue;
    const i = (k / 4) % w, j = ((k / 4) / w) | 0, off = (BAY[(j & 3) * 4 + (i & 3)] / 16 - 0.5) * dither;
    let best = 0, bd = 1e9;
    for (let p = 0; p < P.length; p++) {
      const dr = a[k] + off - P[p][0], dg = a[k + 1] + off - P[p][1], db = a[k + 2] + off - P[p][2];
      const dd = dr * dr * 0.3 + dg * dg * 0.59 + db * db * 0.11;
      if (dd < bd) { bd = dd; best = p; }
    }
    a[k] = P[best][0]; a[k + 1] = P[best][1]; a[k + 2] = P[best][2];
  }
  x.putImageData(d, 0, 0);
}
function tri(x, ax, ay, bx, by, cx2, cy2, col) {
  x.fillStyle = col;
  const minX = Math.floor(Math.min(ax, bx, cx2)), maxX = Math.ceil(Math.max(ax, bx, cx2));
  const minY = Math.floor(Math.min(ay, by, cy2)), maxY = Math.ceil(Math.max(ay, by, cy2));
  const area = (bx - ax) * (cy2 - ay) - (by - ay) * (cx2 - ax);
  if (Math.abs(area) < 0.01) return;
  for (let j = minY; j <= maxY; j++) for (let i = minX; i <= maxX; i++) {
    const px = i + 0.5, py = j + 0.5;
    const w0 = ((bx - px) * (cy2 - py) - (by - py) * (cx2 - px)) / area;
    const w1 = ((cx2 - px) * (ay - py) - (cy2 - py) * (ax - px)) / area;
    const w2 = 1 - w0 - w1;
    if (w0 >= 0 && w1 >= 0 && w2 >= 0) x.fillRect(i, j, 1, 1);
  }
}

// ---------- Paletas ----------
const SCALE = ['#0a110f', '#132019', '#1d3024', '#2b4630', '#3d5f3c', '#567a46', '#7e9a55', '#b3b86c'];
const BELLY = ['#2c1a12', '#4d3220', '#77532f', '#a37a44', '#cba15a', '#ead08a'];
const FIREPAL = ['#fffbe6', '#ffe58a', '#ffb43c', '#ff7a1f', '#d93a1c', '#8a1f1a'];

// ---------- Cuerpo del Cuélebre: segmentos prerenderizados ----------
const SEG = {}, BSEG = {};
function makeSeg(r, pal, scales) {
  const s = Math.ceil(r * 2 + 4), [c, x] = mk(s, s), m = s / 2;
  const g = x.createRadialGradient(m - r * 0.35, m - r * 0.45, r * 0.1, m, m, r * 1.05);
  g.addColorStop(0, pal[pal.length - 1]); g.addColorStop(0.45, pal[Math.floor(pal.length * 0.55)]); g.addColorStop(1, pal[1]);
  x.fillStyle = g; x.beginPath(); x.arc(m, m, r, 0, 7); x.fill();
  if (scales) {
    x.globalCompositeOperation = 'source-atop';
    for (let j = -r; j < r; j += 3) for (let i = -r; i < r; i += 4) {
      const ox = i + ((j / 3) & 1 ? 2 : 0);
      x.strokeStyle = 'rgba(0,0,0,.35)'; x.lineWidth = 1;
      x.beginPath(); x.arc(m + ox, m + j, 2, 0.2, Math.PI - 0.2); x.stroke();
      x.fillStyle = 'rgba(255,240,180,.12)'; x.fillRect(m + ox - 1, m + j - 1, 1, 1);
    }
    x.globalCompositeOperation = 'source-over';
  }
  crisp(c); quantize(c, pal, 22);
  return c;
}
for (let r = 3; r <= 18; r++) { SEG[r] = makeSeg(r, SCALE, true); BSEG[r] = makeSeg(r, BELLY, false); }

// ---------- Cabeza (mirando a la derecha) y mandíbula ----------
const [HEAD, hx] = mk(72, 44);
{
  const x = hx;
  // cuernos hacia atrás
  x.fillStyle = '#c9b48a';
  x.beginPath(); x.moveTo(22, 14); x.quadraticCurveTo(6, 2, 0, 6); x.quadraticCurveTo(8, 8, 18, 20); x.fill();
  x.beginPath(); x.moveTo(26, 12); x.quadraticCurveTo(14, -2, 6, 0); x.quadraticCurveTo(16, 4, 24, 18); x.fill();
  // cráneo
  let g = x.createLinearGradient(0, 6, 0, 32); g.addColorStop(0, '#8fa65e'); g.addColorStop(0.4, '#4d6c42'); g.addColorStop(1, '#1d3024');
  x.fillStyle = g;
  x.beginPath(); x.moveTo(16, 18); x.quadraticCurveTo(20, 6, 34, 8); x.quadraticCurveTo(52, 10, 66, 16); x.quadraticCurveTo(70, 20, 66, 24);
  x.lineTo(40, 27); x.quadraticCurveTo(24, 30, 16, 26); x.closePath(); x.fill();
  // cresta / arco ciliar
  x.fillStyle = '#2b4630'; x.beginPath(); x.moveTo(30, 10); x.quadraticCurveTo(42, 8, 50, 14); x.lineTo(46, 15); x.quadraticCurveTo(38, 12, 31, 14); x.fill();
  // escamas de la frente
  for (let i = 0; i < 9; i++) { x.fillStyle = 'rgba(200,220,140,.35)'; x.fillRect(22 + i * 4, 11 + (i % 2), 2, 1); }
  // pinchos sobre la nuca
  x.fillStyle = '#3d5f3c';
  for (let i = 0; i < 4; i++) { x.beginPath(); x.moveTo(16 + i * 5, 16); x.lineTo(12 + i * 5, 6 - i); x.lineTo(20 + i * 5, 13); x.fill(); }
  // ojo
  x.fillStyle = '#100808'; x.fillRect(42, 15, 7, 4);
  x.fillStyle = '#ffcf3a'; x.fillRect(43, 15, 5, 3); x.fillStyle = '#fff3b0'; x.fillRect(43, 15, 2, 1);
  x.fillStyle = '#1a0b08'; x.fillRect(46, 15, 1, 3);
  // fosa nasal
  x.fillStyle = '#0a110f'; x.fillRect(62, 17, 2, 1);
  // dientes superiores
  x.fillStyle = '#efe4c8';
  for (let i = 0; i < 8; i++) { const tx = 34 + i * 4; x.beginPath(); x.moveTo(tx, 25); x.lineTo(tx + 3, 25); x.lineTo(tx + 1.5, 29 + (i % 3 === 0 ? 2 : 0)); x.fill(); }
  crisp(HEAD); quantize(HEAD, [...SCALE, '#c9b48a', '#8f7a52', '#efe4c8', '#ffcf3a', '#fff3b0', '#100808'], 16); outline(HEAD);
}
const [JAW, jx] = mk(60, 20);
{
  const x = jx;
  let g = x.createLinearGradient(0, 2, 0, 14); g.addColorStop(0, '#3d5f3c'); g.addColorStop(1, '#a37a44');
  x.fillStyle = g;
  x.beginPath(); x.moveTo(6, 3); x.lineTo(50, 4); x.quadraticCurveTo(56, 6, 50, 9); x.quadraticCurveTo(26, 15, 8, 11); x.closePath(); x.fill();
  x.fillStyle = '#5a1c1c'; x.fillRect(12, 4, 36, 2);
  x.fillStyle = '#efe4c8';
  for (let i = 0; i < 8; i++) { const tx = 18 + i * 4; x.beginPath(); x.moveTo(tx, 4); x.lineTo(tx + 3, 4); x.lineTo(tx + 1.5, 0); x.fill(); }
  crisp(JAW); quantize(JAW, [...SCALE, ...BELLY, '#5a1c1c', '#efe4c8'], 14); outline(JAW);
}
const [WING, wx] = mk(150, 100);

// ---------- Escenario: gruta del tesoro ----------
const [BG, bgx] = mk(W, H);
{
  const x = bgx;
  let g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#120d1a'); g.addColorStop(0.6, '#1f1626'); g.addColorStop(1, '#0d0910');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  // paredes lejanas de roca
  for (const [col, base, amp] of [['#1c1522', 70, 30], ['#241a2a', 110, 40]]) {
    x.fillStyle = col; x.beginPath(); x.moveTo(0, H);
    for (let i = 0; i <= W; i += 3) x.lineTo(i, base + amp * Math.sin(i * 0.021 + base) * Math.cos(i * 0.007) + 10 * Math.sin(i * 0.09));
    x.lineTo(W, H); x.fill();
  }
  // estalactitas
  for (let i = 0; i < 26; i++) {
    const sx = rnd() * W, len = 20 + rnd() * 60, w = 6 + rnd() * 14;
    x.fillStyle = i % 3 ? '#1a1320' : '#2a2030';
    x.beginPath(); x.moveTo(sx - w / 2, 0); x.lineTo(sx + w / 2, 0); x.lineTo(sx + rnd() * 3, len); x.fill();
  }
  // montañas de oro del tirano
  for (const [cx, w, h] of [[70, 120, 40], [400, 140, 46], [240, 90, 24]]) {
    for (let j = 0; j < h; j++) {
      const ww = w * Math.sqrt(1 - (j / h)) * 0.5;
      for (let i = -ww; i < ww; i++) {
        const v = rnd();
        x.fillStyle = v < 0.08 ? '#fff1a8' : v < 0.4 ? '#d8a43a' : v < 0.75 ? '#a5712a' : '#6d4520';
        x.fillRect(cx + i, POOL - 6 - j, 1, 1);
      }
    }
  }
  // columnas rotas de la hacienda
  for (const cx of [140, 330]) {
    x.fillStyle = '#2f2636'; x.fillRect(cx, 60, 18, POOL - 60);
    x.fillStyle = '#3b3044'; x.fillRect(cx, 60, 3, POOL - 60);
    x.fillStyle = '#251d2b'; x.fillRect(cx - 4, 56, 26, 6);
  }
  crisp(BG);
  quantize(BG, ['#0d0910', '#120d1a', '#1a1320', '#1f1626', '#241a2a', '#2a2030', '#2f2636', '#3b3044', '#6d4520', '#a5712a', '#d8a43a', '#fff1a8'], 10);
}
// Suelo delantero (tapa la base del cuerpo de la bestia)
const [FG, fgx] = mk(W, H - FLOOR + 30);
{
  const x = fgx, h = H - FLOOR;
  for (let j = 0; j < h + 30; j++) for (let i = 0; i < W; i++) {
    const top = 4 * Math.sin(i * 0.05) + 2 * Math.sin(i * 0.31);
    if (j < 30 + top - 2) continue;
    const t = (j - 28) / h, v = rnd();
    x.fillStyle = t < 0.08 ? (v < 0.5 ? '#6b5a72' : '#58475e') : v < 0.1 ? '#3a2d40' : t < 0.4 ? '#2c2232' : '#1a1320';
    x.fillRect(i, j, 1, 1);
  }
  for (let k = 0; k < 120; k++) { x.fillStyle = 'rgba(10,6,14,.6)'; x.fillRect(rnd() * W, 34 + rnd() * h, 2 + rnd() * 5, 1); }
}
const PLATS = [{ x: 30, y: 164, w: 76 }, { x: 374, y: 164, w: 76 }];
const [PLAT, px_] = mk(80, 16);
{
  const x = px_;
  for (let j = 0; j < 14; j++) for (let i = 0; i < 76; i++) {
    const edge = Math.min(i, 75 - i), lim = j < 4 ? 0 : (j - 4) * 1.4;
    if (edge < lim * 0.6 + (j > 9 ? 8 : 0)) continue;
    const v = rnd();
    x.fillStyle = j === 0 ? '#8a7890' : j < 3 ? '#5e4d66' : v < 0.15 ? '#1a1320' : '#33283b';
    x.fillRect(i + 2, j, 1, 1);
  }
}
const TORCHES = [[24, 120], [456, 120], [200, 96], [282, 96]];

// ---------- Estado de juego ----------
const keys = {};
const KM = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', KeyZ: 'jump', Space: 'jump', KeyW: 'jump', ArrowUp: 'jump', KeyX: 'attack', KeyJ: 'attack', KeyC: 'dash', KeyK: 'dash', ShiftLeft: 'dash' };
addEventListener('keydown', (e) => { const k = KM[e.code]; if (k) { if (!keys[k]) buf[k] = 8; keys[k] = true; e.preventDefault(); } if (e.code === 'KeyR') reset(); audioInit(); });
addEventListener('keyup', (e) => { const k = KM[e.code]; if (k) keys[k] = false; });
if ('ontouchstart' in window) document.body.classList.add('touch');
for (const b of document.querySelectorAll('#touch b')) {
  const k = b.dataset.k;
  b.addEventListener('touchstart', (e) => { if (!keys[k]) buf[k] = 8; keys[k] = true; audioInit(); e.preventDefault(); }, { passive: false });
  b.addEventListener('touchend', (e) => { keys[k] = false; e.preventDefault(); }, { passive: false });
}
// Búfer de entrada: una pulsación vale durante 8 fotogramas (no se pierde durante el hitstop)
const buf = {};
const pressed = (k) => { if (buf[k] > 0) { buf[k] = 0; return true; } return false; };

let P, B, fire, sparks, embers, shake, t, banner, flash, msg, msgT, hitstop;
function reset() {
  P = { x: 90, y: FLOOR, vx: 0, vy: 0, face: 1, ground: true, hp: 6, inv: 0, atk: 0, dash: 0, dashCd: 0, phase: 0, jumps: 1,
    scarf: Array.from({ length: 6 }, () => ({ x: 90, y: FLOOR - 40 })), coat: { x: 80, y: FLOOR - 14, vx: 0, vy: 0 }, dead: 0 };
  const segs = Array.from({ length: 30 }, (_, i) => ({ x: 300, y: POOL + 40 + i * 6 }));
  B = { segs, hx: 300, hy: POOL + 40, tx: 300, ty: POOL + 40, ang: Math.PI, jaw: 0, state: 'hidden', timer: 70, hp: 60, max: 60, flash: 0, wing: 0,
    face: -1, aim: 0, combo: 0, dying: 0 };
  fire = []; sparks = []; embers = Array.from({ length: 40 }, () => ({ x: R(0, W), y: R(0, H), p: R(0, 6) }));
  shake = 0; t = 0; banner = 0; flash = 0; msg = ''; msgT = 0; hitstop = 0;
}
reset();

// ---------- Audio mínimo ----------
let AC = null, fireNode = null;
function audioInit() {
  if (AC) return; try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch { }
}
function noiseBurst(dur, freq, vol, type = 'bandpass') {
  if (!AC) return;
  const len = AC.sampleRate * dur, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = buf; f.type = type; f.frequency.value = freq; g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start();
}
function tone(f0, f1, dur, vol, type = 'sawtooth') {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), n = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(f0, n); o.frequency.exponentialRampToValueAtTime(f1, n + dur);
  g.gain.setValueAtTime(vol, n); g.gain.exponentialRampToValueAtTime(0.001, n + dur);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(n + dur);
}
const roar = () => { tone(140, 50, 1.4, 0.18); tone(90, 40, 1.4, 0.14, 'square'); noiseBurst(1.3, 400, 0.4); };

// ---------- Protagonista: androide gris con ropa ----------
// Fue un soldado. Su mente vive ahora en este cuerpo de máquina.
const [HERO, herox] = mk(64, 64);
const METAL = ['#2a2d34', '#454a54', '#6b717c', '#959ca7', '#c4cad2'];
function drawHero() {
  const x = herox, O = 30, F = 60;
  x.clearRect(0, 0, 64, 64);
  const moving = Math.abs(P.vx) > 0.3 && P.ground, air = !P.ground;
  const bob = moving ? -Math.abs(Math.sin(P.phase)) * 1.6 : Math.sin(t * 0.05) * 0.6;
  const hipY = F - 18 + bob;
  const lean = P.dash ? 0.25 : moving ? 0.08 : 0;
  // pierna: muslo con pantalón de tela, espinilla y pie de metal
  const leg = (ang, bend, cloth, metal) => {
    const kx = O + Math.sin(ang) * 9, ky = hipY + Math.cos(ang) * 9;
    const sa = ang - bend, fx = kx + Math.sin(sa) * 9, fy = ky + Math.cos(sa) * 9;
    x.lineCap = 'round';
    x.strokeStyle = metal; x.lineWidth = 3; x.beginPath(); x.moveTo(kx, ky); x.lineTo(fx, fy); x.stroke();
    x.strokeStyle = cloth; x.lineWidth = 4; x.beginPath(); x.moveTo(O, hipY); x.lineTo(kx, ky); x.stroke();
    x.fillStyle = METAL[0]; x.fillRect(kx - 1, ky, 3, 2);                       // rodilla
    x.fillStyle = metal; x.fillRect(fx - 2, fy - 1, 6, 3);                       // pie metálico
    x.fillStyle = METAL[4]; x.fillRect(fx - 1, fy - 1, 3, 1);
  };
  let a1, a2, b1, b2;
  if (air) { a1 = -0.5; b1 = -0.9; a2 = 0.45; b2 = 0.3; }
  else if (moving) { const s = Math.sin(P.phase); a1 = -s * 0.65; a2 = s * 0.65; b1 = Math.max(0, Math.sin(P.phase + 1.4)) * 0.9; b2 = Math.max(0, -Math.sin(P.phase + 1.4)) * 0.9; }
  else { a1 = -0.12; a2 = 0.14; b1 = 0; b2 = 0; }
  // capa raída: cuelga de los hombros y ondea con la tela simulada
  const pts = P.scarf.map((s2) => ({ x: O + Math.max(-15, Math.min(2, (s2.x - P.x) * P.face)), y: Math.min(F - 4, F + (s2.y - P.y)) }));
  const end = pts[pts.length - 1], mid = pts[Math.floor(pts.length / 2)];
  x.fillStyle = '#2e4a5a';
  x.beginPath(); x.moveTo(O + 3, hipY - 25); x.lineTo(O - 6, hipY - 25);
  x.quadraticCurveTo(mid.x - 4, mid.y, end.x - 2, end.y + 4);
  x.lineTo(end.x + 3, end.y + 1); x.lineTo(end.x + 6, end.y + 5); x.lineTo(O + 1, hipY + 8); x.closePath(); x.fill();
  x.fillStyle = '#1f3442'; x.beginPath(); x.moveTo(O - 2, hipY - 22); x.quadraticCurveTo(mid.x, mid.y + 2, end.x + 2, end.y + 2); x.lineTo(O + 1, hipY + 6); x.fill();
  leg(a1, b1, '#2f2b36', METAL[1]);
  x.save(); x.translate(O, hipY); x.rotate(lean);
  // brazo trasero de metal
  x.strokeStyle = METAL[1]; x.lineWidth = 3; x.lineCap = 'round';
  x.beginPath(); x.moveTo(-4, -21); x.lineTo(-6, -12); x.lineTo(-5, -4); x.stroke();
  // túnica de tela
  let g = x.createLinearGradient(-7, 0, 7, 0); g.addColorStop(0, '#8c8270'); g.addColorStop(0.55, '#6a6152'); g.addColorStop(1, '#4a443b');
  x.fillStyle = g;
  x.beginPath(); x.moveTo(-6, -24); x.lineTo(6, -24); x.lineTo(7, -8); x.lineTo(7, 0); x.lineTo(-7, 0); x.lineTo(-7, -8); x.closePath(); x.fill();
  x.fillStyle = '#3e3931'; x.fillRect(-7, -1, 14, 1); x.fillRect(1, -20, 1, 19);
  x.fillStyle = '#a89c84'; x.fillRect(-6, -23, 1, 14);   // dobladillo y costura
  // remiendo y cinturón con bolsas

function drawFrame() {
  const sx = shake > 0 ? Math.round(R(-shake, shake) * 0.6) : 0, sy = shake > 0 ? Math.round(R(-shake, shake) * 0.6) : 0;
  const cx = -sx, cy = -sy;
  ctx.drawImage(BG, sx * 0.3 | 0, sy * 0.3 | 0);
  // agua del estanque al fondo
  for (let i = 0; i < W; i += 2) {
    const y = POOL + Math.round(Math.sin(i * 0.08 + t * 0.06) * 1.2);
    ctx.fillStyle = (i + t) % 16 < 2 ? '#7aa8c8' : '#2a4058'; ctx.fillRect(i - cx, y - cy, 2, 1);
    ctx.fillStyle = '#16233a'; ctx.fillRect(i - cx, y + 1 - cy, 2, 8);
  }
  // antorchas
  for (const [tx, ty] of TORCHES) {
    ctx.fillStyle = '#2a2030'; ctx.fillRect(tx - 2 - cx, ty - cy, 4, 10);
    for (let k = 0; k < 6; k++) { ctx.fillStyle = FIREPAL[(k + (t >> 2)) % 4]; ctx.fillRect(tx - 2 + ((k * 7 + t) % 4) - cx, ty - 3 - k - ((t + k * 3) % 3) - cy, 2, 2); }
  }
  drawBoss(ctx, cx, cy);
  ctx.drawImage(FG, -cx, FLOOR - 30 - cy);
  for (const p of PLATS) ctx.drawImage(PLAT, p.x - 2 - cx, p.y - cy);
  // protagonista
  if (!(P.inv > 0 && P.inv % 6 < 3 && !P.dash) || P.dead) {
    drawHero();
    ctx.save();
    ctx.translate(Math.round(P.x - cx), Math.round(P.y - 60 - cy));
    if (P.face < 0) ctx.scale(-1, 1);
    if (P.dead) { ctx.globalAlpha = Math.max(0, 1 - P.dead / 120); }
    ctx.drawImage(HERO, -30, 0);
    ctx.restore();
  }
  // tajo del estoque
  if (P.atk > 6 && P.atk < 14) {
    ctx.strokeStyle = 'rgba(230,240,255,.85)'; ctx.lineWidth = 2;
    const ax = P.x + P.face * 18 - cx, ay = P.y - 30 - cy, k = (14 - P.atk) / 7;
    ctx.beginPath(); ctx.arc(ax - P.face * 4, ay, 14, P.face > 0 ? -1.2 + k : Math.PI + 1.2 - k, P.face > 0 ? 0.3 + k : Math.PI - 0.3 - k, P.face < 0); ctx.stroke();
  }
  // fuego (aditivo) y humo
  for (const f of fire) {
    const r = f.life / f.max;
    if (r < 0.22) { ctx.fillStyle = `rgba(60,45,50,${r * 2.5})`; const s = Math.ceil(f.s * 1.6); ctx.fillRect(Math.round(f.x - s / 2 - cx), Math.round(f.y - s / 2 - cy), s, s); }
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const f of fire) {
    const r = f.life / f.max; if (r < 0.22) continue;
    const ci = r > 0.85 ? 0 : r > 0.7 ? 1 : r > 0.52 ? 2 : r > 0.38 ? 3 : 4;
    ctx.fillStyle = FIREPAL[ci]; const s = Math.ceil(f.s);
    ctx.fillRect(Math.round(f.x - s / 2 - cx), Math.round(f.y - s / 2 - cy), s, s);
  }
  ctx.globalCompositeOperation = 'source-over';
  for (const p of sparks) { ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x - cx), Math.round(p.y - cy), p.life > 10 ? 2 : 1, p.life > 10 ? 2 : 1); }
  for (const e of embers) { e.p += 0.02; e.y -= 0.25; e.x += Math.sin(e.p) * 0.3; if (e.y < 0) { e.y = H; e.x = R(0, W); } ctx.fillStyle = Math.sin(e.p * 4) > 0 ? '#ffb43c' : '#a5712a'; ctx.fillRect(e.x | 0, e.y | 0, 1, 1); }

  // ---- iluminación ----
  const lights = [];
  for (const [tx, ty] of TORCHES) lights.push([tx, ty - 4, 46 + Math.sin(t * 0.3 + tx) * 3, 'rgba(255,150,60,']);
  lights.push([P.x + P.face * 3, P.y - 34, 50, 'rgba(120,230,255,']);
  if (B.state !== 'hidden' && B.state !== 'dead') { const ex = B.hx + Math.cos(B.ang) * 26, ey = B.hy + Math.sin(B.ang) * 26 - 4; lights.push([ex, ey, 18, 'rgba(255,210,60,']); }
  let fx = 0, fy = 0, fn = 0;
  for (let i = 0; i < fire.length; i += 5) { fx += fire[i].x; fy += fire[i].y; fn++; if (fn % 6 === 0) lights.push([fire[i].x, fire[i].y, 50, 'rgba(255,120,40,']); }
  if (B.state !== 'hidden' && B.state !== 'dead') lights.push([B.segs[3].x, B.segs[3].y, 70, 'rgba(160,200,120,']);
  if (B.state === 'windup') lights.push([B.hx + Math.cos(B.ang) * 40, B.hy + Math.sin(B.ang) * 40, 30 + (55 - B.timer), 'rgba(255,170,60,']);
  const fireAmt = Math.min(1, fire.length / 300);
  dkx.globalCompositeOperation = 'source-over'; dkx.clearRect(0, 0, W, H);
  dkx.fillStyle = `rgba(8,5,14,${0.72 - fireAmt * 0.3})`; dkx.fillRect(0, 0, W, H);
  dkx.globalCompositeOperation = 'destination-out';
  for (const [lx, ly, lr] of lights) {
    const g = dkx.createRadialGradient(lx - cx, ly - cy, 0, lx - cx, ly - cy, lr);
    g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.5, 'rgba(0,0,0,.6)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    dkx.fillStyle = g; dkx.fillRect(lx - lr - cx, ly - lr - cy, lr * 2, lr * 2);
  }
  ctx.drawImage(DARK, 0, 0);
  ctx.globalCompositeOperation = 'lighter';
  for (const [lx, ly, lr, col] of lights) {
    const g = ctx.createRadialGradient(lx - cx, ly - cy, 0, lx - cx, ly - cy, lr * 0.9);
    g.addColorStop(0, col + '0.22)'); g.addColorStop(1, col + '0)');
    ctx.fillStyle = g; ctx.fillRect(lx - lr - cx, ly - lr - cy, lr * 2, lr * 2);
  }
  if (fireAmt > 0) { ctx.fillStyle = `rgba(255,90,20,${fireAmt * 0.12})`; ctx.fillRect(0, 0, W, H); }
  ctx.globalCompositeOperation = 'source-over';
  // bloom
  blx.clearRect(0, 0, 120, 68); blx.filter = 'brightness(1.2) contrast(1.8) blur(2px)'; blx.drawImage(cv, 0, 0, 120, 68); blx.filter = 'none';
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = 0.35; ctx.imageSmoothingEnabled = true; ctx.drawImage(BLOOM, 0, 0, W, H); ctx.restore(); ctx.imageSmoothingEnabled = false;
  const vg = ctx.createRadialGradient(W / 2, H / 2, 120, W / 2, H / 2, 290); vg.addColorStop(0, 'rgba(5,3,8,0)'); vg.addColorStop(1, 'rgba(5,3,8,.6)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (flash > 0) { ctx.fillStyle = `rgba(255,240,220,${flash / 30})`; ctx.fillRect(0, 0, W, H); }

  // ---- HUD ----
  for (let i = 0; i < 6; i++) {
    const on = i < P.hp;
    ctx.fillStyle = '#0b0810'; ctx.fillRect(10 + i * 11, 10, 9, 11);
    ctx.fillStyle = on ? '#b23246' : '#2a1c24'; ctx.fillRect(11 + i * 11, 11, 7, 9);
    if (on) { ctx.fillStyle = '#f07a7a'; ctx.fillRect(12 + i * 11, 12, 2, 3); }
  }
  if (banner) {
    const a = Math.min(1, banner / 30) * (banner > 200 ? Math.max(0, (260 - banner) / 60) : 1);
    if (banner < 260) {
      ctx.globalAlpha = a;
      text('EL CUÉLEBRE', W / 2, 200, 2, '#e8d29a');
      text('GUARDIÁN DEL TESORO DEL PATRÓN', W / 2, 220, 1, '#9d8aa8');
      ctx.globalAlpha = 1;
    }
  }
  if (B.state !== 'hidden' || B.hp < B.max) if (banner > 240 && B.state !== 'dead') {
    ctx.fillStyle = '#0b0810'; ctx.fillRect(100, 252, 280, 7);
    ctx.fillStyle = '#3a1418'; ctx.fillRect(101, 253, 278, 5);
    ctx.fillStyle = B.hp < B.max / 2 ? '#e2562a' : '#b23246'; ctx.fillRect(101, 253, Math.max(0, 278 * B.hp / B.max), 5);
    ctx.fillStyle = '#ffcf8a'; ctx.fillRect(101, 253, Math.max(0, 278 * B.hp / B.max), 1);
    text('EL CUÉLEBRE', W / 2, 243, 1, '#c9b48a');
  }
  if (msgT > 0) { ctx.globalAlpha = Math.min(1, msgT / 40); text(msg, W / 2, 110, 2, msg.startsWith('LA') ? '#ffe58a' : '#d26a6a'); ctx.globalAlpha = 1; }
  if (t < 240 && B.state === 'hidden' && !banner) text('ALGO SE MUEVE BAJO EL AGUA...', W / 2, 60, 1, '#9d8aa8');
}

// Texto con fuente del sistema renderizada a píxel (provisional)
const [TXT, tx_] = mk(480, 40);
function text(s, x, y, scale, col) {
  tx_.clearRect(0, 0, 480, 40);
  tx_.font = `${scale === 2 ? 'bold 16' : '9'}px Georgia, 'Times New Roman', serif`;
  tx_.textAlign = 'center'; tx_.textBaseline = 'middle';
  tx_.fillStyle = col; tx_.fillText(s, 240, 20);
  crisp(TXT, 110); outline(TXT, '#0b0810');
  ctx.drawImage(TXT, Math.round(x - 240), Math.round(y - 20));
}

function step() {
  if (hitstop > 0) { hitstop--; return; }
  t++;
  updatePlayer(); updateBoss(); updateFire();
  for (const p of sparks) {
    if (p.toMouth) { const mx = B.hx + Math.cos(B.ang) * 40, my = B.hy + Math.sin(B.ang) * 40; p.x += (mx - p.x) * 0.15; p.y += (my - p.y) * 0.15; }
    else { p.x += p.vx; p.y += p.vy; p.vy += 0.08; }
    p.life--;
  }
  sparks = sparks.filter((p) => p.life > 0);
  if (shake > 0) shake *= 0.86; if (shake < 0.3) shake = 0;
  if (flash > 0) flash--;
  if (banner) banner++;
  if (msgT > 0) msgT--;
  for (const k in buf) if (buf[k] > 0) buf[k]--;
}
let acc = 0, last = performance.now();
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  drawFrame();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__dbg = { get P() { return P; }, get B() { return B; }, keys, buf, step, drawFrame, setState };
</script>
